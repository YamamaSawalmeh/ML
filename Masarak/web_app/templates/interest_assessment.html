<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Interest Assessment</h1>
        <form action="{{ url_for('assess_interests') }}" method="POST">
            <label for="interests">Please select your interests:</label><br>
            <input type="checkbox" name="interests" value="science"> Science<br>
            <input type="checkbox" name="interests" value="arts"> Arts<br>
            <input type="checkbox" name="interests" value="technology"> Technology<br>
            <input type="checkbox" name="interests" value="business"> Business<br>
            <input type="checkbox" name="interests" value="health"> Health<br>
            <input type="checkbox" name="interests" value="education"> Education<br>
            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
