<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Diploma</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Upload Your Diploma</h1>
        <form action="{{ url_for('upload_diploma') }}" method="post" enctype="multipart/form-data">
            <label for="diploma">Select Diploma File:</label>
            <input type="file" id="diploma" name="diploma" accept=".pdf,.jpg,.jpeg,.png" required>
            <br><br>
            <input type="submit" value="Upload">
        </form>
        <br>
        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>
</body>
</html>
